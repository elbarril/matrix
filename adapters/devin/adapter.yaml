# Trainman adapter — Devin
# Maps abstract capabilities to Devin's native tools.
target: devin
capabilities:
  read: read_file
  edit: [edit, multi_edit]
  search: [grep_search, find_by_name]
  code-nav: codebase_search   # fallback: grep_search
  run-subagent: run_subagent
  run-command: run_command
  ask-user: ask_user_question
  browser: mcp__chrome-browser   # visual QA (screenshots, rendered-page checks); no-op if the
                                 # chrome-browser MCP server isn't configured for a given project
  docs-lookup: mcp__context7     # current, version-pinned library/framework docs (Oracle);
                                 # added 2026-07-15 via `devin mcp add context7 --url
                                 # https://mcp.context7.com/mcp --scope user`

# allowed-tools categories accepted by Devin's SKILL.md/AGENT.md frontmatter
# (per docs: read, edit, grep, glob, exec, plus mcp__server__tool patterns).
# `ask-user` and `run-subagent` are NOT listed here on purpose: neither is a
# grantable allowed-tools entry (ask_user_question is unconditionally withheld
# from subagents; run_subagent/read_subagent are disabled inside a subagent by
# default regardless of allowed-tools). Listing them would be a no-op at best.
allowed_tools:
  read: [read]
  edit: [edit]
  search: [grep, glob]
  code-nav: [grep, glob]              # no dedicated category; documented fallback
  run-command: [exec]
  browser: ["mcp__chrome-browser__*"]
  docs-lookup: ["mcp__context7__*"]

render:
  master: skill              # → .agents/skills/<name>/SKILL.md
  specialist: subagent       # → .agents/agents/<name>/AGENT.md

model_policy:
  # Re-derived 2026-07-17 from devin-master-documentation's model pages
  # (docs/22-devin-cli-models-overview.md, docs/26-cognition-swe-models.md),
  # which mirror Devin CLI's own model-selection guidance (models.mdx):
  #   - "multi-file refactors, architecture changes, deep reasoning" -> opus or gpt
  #   - "quick edits, bug fixes, cost-sensitive work" -> swe (fast)
  #   - mixed workloads -> adaptive (Cognition's own per-task router)
  # SWE-1.7 (the prior default for reasoning/auto) is a few points behind
  # Opus 4.7/4.8 and GPT-5.5 on FrontierCode/Terminal-Bench/SWE-Bench
  # Multilingual per Cognition's own comparison table, and its free-preview
  # window ends 2026-08-08 — so pinning reasoning-tier work to it was both
  # off-guidance and time-bound. User chose capability-first for `reasoning`
  # (accepting real per-token cost) and `adaptive` for `auto` (2026-07-17).
  cheap: swe-1-7-lightning    # mechanical/fast work (Keymaker, Lock): lower latency, same preview pricing
  reasoning: opus             # planning/architecture/research/evaluation (Architect, Morpheus, Oracle, Smith): Devin CLI's own guidance for deep reasoning; $5/$25 per MTok, 1M context
  auto: adaptive              # mixed workloads (Neo, Trinity): Cognition's per-task router; intro rate $0.50/$2.00 per MTok (re-check after its intro window)
