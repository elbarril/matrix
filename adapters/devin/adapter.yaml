# Trainman adapter — Devin
# Maps abstract capabilities to Devin's native tools.
target: devin
capabilities:
  read: read_file
  edit: [edit, multi_edit, write]
  search: [grep_search, find_by_name]
  code-nav: codebase_search   # fallback: grep_search
  run-subagent: run_subagent
  run-command: run_command
  ask-user: ask_user_question
  browser: mcp__chrome-browser   # visual QA (screenshots, rendered-page checks); no-op if the
                                 # chrome-browser MCP server isn't configured for a given project
  docs-lookup: mcp__context7     # current, version-pinned library/framework docs (Oracle);
                                 # added 2026-07-15 via `devin mcp add context7 --url
                                 # https://mcp.context7.com/mcp --scope user`

# allowed-tools categories accepted by Devin's SKILL.md/AGENT.md frontmatter
# (per docs: read, edit, grep, glob, exec, plus mcp__server__tool patterns).
# `ask-user` is NOT listed here on purpose: it is unconditionally withheld from
# subagents, so it is not a grantable allowed-tools entry. `run-subagent` is
# representable through a separate `max-nesting` frontmatter field for agents
# that need to spawn subagents (ship captains, not crew leaves). Listing
# `run-subagent` in allowed-tools would be a no-op because it is not a Devin
# allowed-tools category.
allowed_tools:
  read: [read]
  edit: [edit, write]
  search: [grep, glob]
  code-nav: [grep, glob]              # no dedicated category; documented fallback
  run-command: [exec]
  browser: ["mcp__chrome-browser__*"]
  docs-lookup: ["mcp__context7__*"]

# Nesting field used by the Trainman for agents that need to spawn subagents.
# Devin supports a `max-nesting` frontmatter key on custom subagent profiles.
nesting:
  field: max-nesting

render:
  master: skill              # → .agents/skills/<name>/SKILL.md
  specialist: subagent       # → .agents/agents/<name>/AGENT.md

model_policy:
  # Re-derived 2026-07-17 from devin-master-documentation's model pages
  # (docs/22-devin-cli-models-overview.md, docs/26-cognition-swe-models.md),
  # which mirror Devin CLI's own model-selection guidance (models.mdx):
  #   - "multi-file refactors, architecture changes, deep reasoning" -> opus or gpt
  #   - "quick edits, bug fixes, cost-sensitive work" -> swe (fast)
  #   - mixed workloads -> adaptive (Cognition's own per-task router)
  # SWE-1.7 Medium is gratis hoy durante su beta. La fecha 2026-08-08
  # atribuida al fin de su free preview no es re-verificable hoy en una fuente
  # viva: conservarla como no confirmada y re-chequear periódicamente.
  # User chose capability-first for `reasoning` (accepting real per-token cost)
  # and `adaptive` for `auto` (2026-07-17).
  cheap: swe-1-7-medium       # mechanical/plumbing work (Keymaker, Lock, Logos Sparks): gratis hoy en beta; free-preview end date not confirmed, recheck periodically
  reasoning: opus             # planning/architecture/research/evaluation (Architect, Morpheus, Oracle, Smith): floating alias for the latest Claude Opus family version; $5/$25 per MTok, 1M context
  auto: adaptive              # mixed workloads (Neo, Trinity): Cognition's per-task router; intro pricing expired 2026-07-07, post-intro rate depends on the user's billing plan
