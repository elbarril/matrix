# Trainman adapter — Devin
# Maps abstract capabilities to Devin's native tools.
target: devin
capabilities:
  read: read_file
  edit: [edit, multi_edit, write]
  search: [grep_search, find_by_name]
  code-nav: codebase_search   # fallback: grep_search
  run-subagent: run_subagent
  run-command: run_command
  ask-user: ask_user_question
  browser: mcp__chrome-browser   # visual QA (screenshots, rendered-page checks); no-op if the
                                 # chrome-browser MCP server isn't configured for a given project
  docs-lookup: mcp__context7     # current, version-pinned library/framework docs (Oracle);
                                 # added 2026-07-15 via `devin mcp add context7 --url
                                 # https://mcp.context7.com/mcp --scope user`

# allowed-tools categories accepted by Devin's SKILL.md/AGENT.md frontmatter
# (per docs: read, edit, grep, glob, exec, plus mcp__server__tool patterns).
# `ask-user` is NOT listed here on purpose: it is unconditionally withheld from
# subagents, so it is not a grantable allowed-tools entry. `run-subagent` is
# representable through a separate `max-nesting` frontmatter field for agents
# that need to spawn subagents (ship captains, not crew leaves). Listing
# `run-subagent` in allowed-tools would be a no-op because it is not a Devin
# allowed-tools category.
allowed_tools:
  read: [read]
  edit: [edit, write]
  search: [grep, glob]
  code-nav: [grep, glob]              # no dedicated category; documented fallback
  run-command: [exec]
  browser: ["mcp__chrome-browser__*"]
  docs-lookup: ["mcp__context7__*"]

# Nesting field used by the Trainman for agents that need to spawn subagents.
# Devin supports a `max-nesting` frontmatter key on custom subagent profiles.
nesting:
  field: max-nesting

render:
  master: skill              # → .agents/skills/<name>/SKILL.md
  specialist: subagent       # → .agents/agents/<name>/AGENT.md

artifacts:
  generated_agents_dir: "adapters/devin/generated/.agents/agents"
  installed_agents_dir: "~/.config/devin/agents"
  installed_skills_dir: "~/.config/devin/skills"

harden:
  config_path: "~/.config/devin/config.json"
  schema: "permissions_deny_v1"

# Declarative Exec allowlist merged by install-hooks.sh into
# ~/.config/devin/config.json permissions.allow. Prefix-only match per
# Devin CLI docs: `Exec(bin/matrix)` covers every `bin/matrix ...` invocation.
# Keep this list minimal and Matrix-specific; do NOT add a wildcard `Exec(*)`.
permissions_allow:
  - "Exec(bin/matrix)"
  - "Exec(grep)"
  - "Exec(git)"
  - "Exec(find)"
  - "Exec(ls)"
  - "Exec(cat)"

install_integrity:
  # Reuses artifacts.installed_agents_dir and harden.config_path — do not
  # duplicate those paths here.
  config_path: "~/.config/devin/config.json"        # = harden.config_path today; keep both keys, do not assume identical in future adapters
  required_hooks:
    # event -> substring that MUST appear in at least one hooks[event][*].hooks[*].command
    SessionStart:      "session_audit.py"
    UserPromptSubmit:  "session_audit.py"
    PostCompaction:    "session_audit.py"
    SessionEnd:        "session_audit.py"
    PostToolUse:       "session_audit.py"
    PreToolUse:        "pre_tool_use_guard.py"
    Stop:              "stop_notify.py"
  mcp_config_path: "~/.config/devin/mcp_config.json"   # confirmed: key path is mcpServers.<name>
  required_mcp_servers: ["chrome-browser", "context7"]
  installed_agent_path_template: "{installed_agents_dir}/{agent}/AGENT.md"
  installed_skill_path_template: "{installed_skills_dir}/{skill}/SKILL.md"

binding:
  file: "AGENTS.local.md"
  begin_marker: "<!-- MATRIX:BEGIN"
  end_marker: "<!-- MATRIX:END -->"
  doc_path: "DEVIN.md"          # root-relative path to this adapter's own reference doc,
                                 # resolved into {{ADAPTER_DOC_PATH}} by matrix_block_tmp()/_build.py/session_audit.py
  gitignore_entries:
    - "AGENTS.local.md"
    - "_brain"

# Model templates: 5 cost/quality presets selectable at build time via
# `bin/matrix build --target=devin --template=<name>`. The default is
# `equilibrado` when no `--template` is supplied and no persisted choice
# exists (changed from `gratis` on 2026-08-03, per user preference).
# NOTE: model identifiers (`swe-1-6-fast`, `opus`) MUST be re-verified against
# the real Devin CLI model picker (`/model` without arguments) the next time
# anyone touches them — same "needs verification" convention as `swe-1-7-medium`
# below.
model_templates: [gratis, barato, equilibrado, caro, veloz]

model_template_gratis:
  cheap: swe-1-7-medium
  reasoning: swe-1-7-medium
  auto: swe-1-7-medium

model_template_barato:
  cheap: swe-1-7-medium
  reasoning: swe-1-6-fast
  auto: swe-1-7-medium

model_template_equilibrado:
  cheap: swe-1-7-medium
  reasoning: sonnet
  auto: adaptive

model_template_caro:
  cheap: sonnet
  reasoning: opus
  auto: adaptive

# `veloz`: lower cost / lower latency than `equilibrado` for the `reasoning`
# tier (Architect, Morpheus, Oracle, Smith) while keeping `cheap` on the
# free SWE tier. `gemini-3.5-flash` is a candidate model ID pulled from
# Google's own published API model ID table in
# devin-master-documentation/docs/25-google-gemini-models.md (2026-07-17
# snapshot); it is NOT yet confirmed against this installation's live Devin
# CLI `/model` picker and MUST be re-verified with `/model` before being
# treated as load-bearing.
model_template_veloz:
  cheap: swe-1-7-medium
  reasoning: gemini-3.5-flash
  auto: adaptive

model_policy:
  # Re-derived 2026-07-17 from devin-master-documentation's model pages
  # (docs/22-devin-cli-models-overview.md, docs/26-cognition-swe-models.md),
  # which mirror Devin CLI's own model-selection guidance (models.mdx):
  #   - "multi-file refactors, architecture changes, deep reasoning" -> opus or gpt
  #   - "quick edits, bug fixes, cost-sensitive work" -> swe (fast)
  #   - mixed workloads -> adaptive (Cognition's own per-task router)
  # SWE-1.7 Medium is gratis hoy durante su beta. La fecha 2026-08-08
  # atribuida al fin de su free preview no es re-verificable hoy en una fuente
  # viva: conservarla como no confirmada y re-chequear periódicamente.
  # User chose capability-first for `reasoning` (accepting real per-token cost)
  # and `adaptive` for `auto` (2026-07-17). Switched `reasoning` from `opus` to
  # `sonnet` (2026-07-27) trading a small, measured quality gap (SWE-bench
  # Verified 85.2% vs 88.6%, per docs/23-anthropic-claude-models.md) for lower
  # latency and ~60% lower per-token cost ($2-3/$10-15 vs $5/$25) — user chose
  # speed/cost over max quality for all 4 reasoning-tier specialists.
  cheap: swe-1-7-medium       # mechanical/plumbing work (Lock, Logos Sparks): gratis hoy en beta; free-preview end date not confirmed, recheck periodically
  reasoning: sonnet           # planning/architecture/research/evaluation (Architect, Morpheus, Oracle, Smith): floating alias for the latest Claude Sonnet family version; Anthropic frames it as "broadly comparable to Opus" at a fraction of the latency/cost ($2/$10 intro through 2026-08-31, then $3/$15; vs Opus $5/$25), 1M context
  auto: adaptive              # mixed workloads (Neo, Trinity): Cognition's per-task router; intro pricing expired 2026-07-07, post-intro rate depends on the user's billing plan
