# Trainman adapter — Devin
# Maps abstract capabilities to Devin's native tools.
target: devin
capabilities:
  read: read_file
  edit: [edit, multi_edit]
  search: [grep_search, find_by_name]
  code-nav: codebase_search   # fallback: grep_search
  run-subagent: run_subagent
  run-command: run_command
  ask-user: ask_user_question
render:
  master: skill              # → .agents/skills/<name>/SKILL.md
  specialist: subagent       # → .agents/agents/<name>/AGENT.md
model_policy:
  # All three tiers pinned to the same model today because it is the one
  # currently free on the Devin plan (SWE 1.7). Once model choice matters
  # more than cost, split these independently — e.g. reasoning: opus,
  # cheap: swe-1-7 — then `bin/matrix build && bin/matrix install --target=devin`.
  cheap: swe-1-7
  reasoning: swe-1-7
  auto: swe-1-7
