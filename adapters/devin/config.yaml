experiment:
  # 2026-07-28: enabled. Extended by B1-Option 1 (post-audit backlog, see
  # brain/output/architecture/matrix-system-health-audit.md): reinjection now
  # fires in Matrix workspace mode AND for a real bound external project (see
  # adapters/devin/hooks/session_audit.py's _activation_reinject_scope()),
  # not workspace-only — the one-shot AGENTS.local.md block written by
  # `bin/matrix select` is not enough on its own once the session's context
  # window moves past it.
  activation_inject: true
  # 2026-09-01: changed to false per Camino 2 decision. Revert if BLOCK ratio
  # exceeds 21% over >=20 phase:close events, or if any contract violation is
  # traced to a throttled turn without recent full reinjection.
  activation_inject_userprompt_full: false

secret_deny:
  # DESHABILITADA por decisión del usuario el 2026-09-07 (incidente
  # incident-secret-deny-overblock-tl0090). Motivo: la deny list Read(...)
  # del CLI bloquea también los tools read/grep/glob y los comandos exec que
  # leen contenido con path literal (cat/ls) — causó bloqueos sin workaround
  # (doc del propio CLI, chequeos de existencia de credenciales) y la sesión
  # en curso conserva el snapshot de permisos hasta reiniciar.
  # Ya se aplicó `bin/matrix harden --target=devin --revert` (config.json
  # permissions.deny = []). Para re-habilitar: restaurar esta config y correr
  # `bin/matrix harden --target=devin --apply`.
  # Semántica del matcher (verificada 2026-09-07, Devin CLI 3000.6.14):
  # Read(<glob>) bloquea read/grep/glob + exec con path literal (cat/ls);
  # NO bloquea test -f, source, ni indirección $HOME. Ver lección 65.
  enabled: false
  static: []
  class_b_repo_secrets:
    enabled: false
    patterns: []
  discover:
    enabled: false
    max_depth: 3
  exclude: []
