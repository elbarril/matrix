experiment:
  # 2026-07-28: enabled. Extended by B1-Option 1 (post-audit backlog, see
  # brain/output/architecture/matrix-system-health-audit.md): reinjection now
  # fires in Matrix workspace mode AND for a real bound external project (see
  # adapters/devin/hooks/session_audit.py's _activation_reinject_scope()),
  # not workspace-only — the one-shot AGENTS.local.md block written by
  # `bin/matrix select` is not enough on its own once the session's context
  # window moves past it.
  activation_inject: true
  # 2026-09-01: changed to false per Camino 2 decision. Revert if BLOCK ratio
  # exceeds 21% over >=20 phase:close events, or if any contract violation is
  # traced to a throttled turn without recent full reinjection.
  activation_inject_userprompt_full: false

secret_deny:
  static:
    - "~/.ssh/**"
    - "~/.aws/**"
    - "~/.gnupg/**"
    - "~/.git-credentials"
    - "~/.netrc"
    - "~/.npmrc"
    - "~/.pypirc"
    - "~/.docker/**"
    - "~/.kube/config"
    - "~/.config/gh/hosts.yml"
    - "~/.config/gcloud/credentials.db"
    - "~/.local/share/devin/**"
    - "~/.local/share/keyrings/**"
    - "~/.mozilla/firefox/**/logins.json"
    - "~/.config/google-chrome/**/Login Data"
  class_b_repo_secrets:
    # 2026-09-05: enabled per remediation decision U(i) (D4 flip inmediato).
    # Cubre la superficie `read` del incidente 2 de la lección 49; la superficie
    # `exec sed` del incidente 1 sigue abierta (grep/glob/exec cat no bloqueados).
    enabled: true
    patterns:
      - "**/.env"
      - "**/.env.local"
      - "**/.env.production"
      - "**/*.pem"
      - "**/id_rsa"
      - "**/id_ed25519"
  discover:
    enabled: true
    max_depth: 3
  exclude: []
