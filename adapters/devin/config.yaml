# Feature flags for the Devin adapter — canonical values above the DEFAULTS in
# hooks/_flags.py and below env MATRIX_<NAME>. This section absorbs the legacy
# experiment.activation_inject*, experiment.activation_inject_userprompt_full
# and secret_deny.enabled knobs; hooks read flags exclusively via _flags.py.
flags:
  activation.reinject: false         # absorbe experiment.activation_inject
  activation.reinject_full: false    # absorbe experiment.activation_inject_userprompt_full
  gate.shared_surface: false
  gate.writer_lane: false
  gate.pre_exec_guard: false
  gate.secret_deny: false            # absorbe secret_deny.enabled
  hooks.pre_activation_check: false
  hooks.boot_warn: false
  hooks.session_extras: false        # extras no-audit de session_audit (orphan, flags:state, routing-signal, nudge)
  memory.tree: false
  views.scoped: false
  binding.artifacts: false

secret_deny:
  # DESHABILITADA por decisión del usuario el 2026-09-07 (incidente
  # incident-secret-deny-overblock-tl0090). Motivo: la deny list Read(...)
  # del CLI bloquea también los tools read/grep/glob y los comandos exec que
  # leen contenido con path literal (cat/ls) — causó bloqueos sin workaround
  # (doc del propio CLI, chequeos de existencia de credenciales) y la sesión
  # en curso conserva el snapshot de permisos hasta reiniciar.
  # Ya se aplicó `bin/matrix harden --target=devin --revert` (config.json
  # permissions.deny = []). Para re-habilitar: restaurar esta config y correr
  # `bin/matrix harden --target=devin --apply`.
  # Semántica del matcher (verificada 2026-09-07, Devin CLI 3000.6.14):
  # Read(<glob>) bloquea read/grep/glob + exec con path literal (cat/ls);
  # NO bloquea test -f, source, ni indirección $HOME. Ver lección 65.
  enabled: false
  static: []
  class_b_repo_secrets:
    enabled: false
    patterns: []
  discover:
    enabled: false
    max_depth: 3
  exclude: []
